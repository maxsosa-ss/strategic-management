site_name: sm-connectors
site_description: Conexiones reutilizables a MicroStrategy y Google
docs_dir: docs
strict: true

theme:
  name: material
  language: es
  font:
    text: Inter
    code: false
  features:
    - navigation.sections
    - content.code.copy
    - search.suggest
  palette:
    scheme: default

extra_css:
  - assets/marca.css

nav:
  - Inicio: index.md
  - Instalación y configuración: configuracion.md
  - Recetas: recetas.md
  - Referencia: referencia.md
  - Historial de cambios: cambios.md

plugins:
  - search:
      lang: es
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            docstring_style: null
            members_order: source

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: false
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
