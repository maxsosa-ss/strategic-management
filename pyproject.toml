[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smpy"
version = "0.4.0"
description = "Conexiones a MicroStrategy y Google, y herramientas de datos reutilizables (wrappers finos sobre los SDK oficiales)."
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0", "pandas>=2.0"]

[project.optional-dependencies]
mstr = ["mstrio-py>=11.4"]
google = ["google-auth>=2.0", "google-auth-oauthlib>=1.0", "gspread>=6.0", "google-api-python-client>=2.0"]
gcs = ["google-cloud-storage>=2.0", "pyarrow>=14"]
all = ["smpy[mstr,google,gcs]"]
dev = ["pytest>=8"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["live: requiere credenciales reales (correr con -m live)"]
addopts = "-m \"not live\""
