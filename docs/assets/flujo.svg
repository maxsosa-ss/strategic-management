<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" role="img" aria-labelledby="t d">
  <title id="t">Los dos flujos de sm-connectors</title>
  <desc id="d">Primer flujo: un reporte de MicroStrategy pasa a un DataFrame, con transformación opcional, y se escribe en una hoja de Google Sheets. Segundo flujo: una hoja de Google Sheets pasa a un DataFrame y alimenta un super cube de MicroStrategy.</desc>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#434343"/>
    </marker>
  </defs>
  <style>
    .t { font-family: Roboto, Arial, Helvetica, sans-serif; font-weight: 700; font-size: 16px; }
    .s { font-family: Inter, Arial, Helvetica, sans-serif; font-size: 12px; }
    .f { font-family: Inter, Arial, Helvetica, sans-serif; font-weight: 600; font-size: 13px; fill: #278976; }
  </style>
  <rect width="760" height="262" rx="8" fill="#F9FAFA"/>

  <text class="f" x="30" y="34">report_to_sheet</text>
  <rect x="30" y="46" width="190" height="64" rx="6" fill="#278976"/>
  <text class="t" x="125" y="73" text-anchor="middle" fill="#FFFFFF">Reporte</text>
  <text class="s" x="125" y="93" text-anchor="middle" fill="#FFFFFF">MicroStrategy</text>
  <line x1="222" y1="78" x2="283" y2="78" stroke="#434343" stroke-width="2" marker-end="url(#p)"/>
  <rect x="285" y="46" width="190" height="64" rx="6" fill="#F1F3F3" stroke="#278976" stroke-width="2"/>
  <text class="t" x="380" y="73" text-anchor="middle" fill="#278976">DataFrame</text>
  <text class="s" x="380" y="93" text-anchor="middle" fill="#434343">transformación opcional</text>
  <line x1="477" y1="78" x2="538" y2="78" stroke="#434343" stroke-width="2" marker-end="url(#p)"/>
  <rect x="540" y="46" width="190" height="64" rx="6" fill="#42E2C6"/>
  <text class="t" x="635" y="73" text-anchor="middle" fill="#434343">Hoja de Google</text>
  <text class="s" x="635" y="93" text-anchor="middle" fill="#434343">reemplazar o agregar filas</text>

  <text class="f" x="30" y="158">sheet_to_supercube</text>
  <rect x="30" y="170" width="190" height="64" rx="6" fill="#42E2C6"/>
  <text class="t" x="125" y="197" text-anchor="middle" fill="#434343">Hoja de Google</text>
  <text class="s" x="125" y="217" text-anchor="middle" fill="#434343">una pestaña completa</text>
  <line x1="222" y1="202" x2="283" y2="202" stroke="#434343" stroke-width="2" marker-end="url(#p)"/>
  <rect x="285" y="170" width="190" height="64" rx="6" fill="#F1F3F3" stroke="#278976" stroke-width="2"/>
  <text class="t" x="380" y="197" text-anchor="middle" fill="#278976">DataFrame</text>
  <text class="s" x="380" y="217" text-anchor="middle" fill="#434343">transformación opcional</text>
  <line x1="477" y1="202" x2="538" y2="202" stroke="#434343" stroke-width="2" marker-end="url(#p)"/>
  <rect x="540" y="170" width="190" height="64" rx="6" fill="#278976"/>
  <text class="t" x="635" y="197" text-anchor="middle" fill="#FFFFFF">Super cube</text>
  <text class="s" x="635" y="217" text-anchor="middle" fill="#FFFFFF">crear o actualizar</text>
</svg>
